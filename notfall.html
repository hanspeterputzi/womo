<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Womo Notfall</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#b91c1c">
<link rel="apple-touch-icon" href="icon-180.png">
<script>try{var t=localStorage.getItem('womo-theme');if(t==='hell')document.documentElement.setAttribute('data-theme','light');else if(t==='dunkel')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<style>
/* Notfallkarte: eine einzige Datei ohne Netz-Abhaengigkeit. Daten kommen aus dem Auszug, den die App im Handy ablegt (localStorage 'womo-notfall'). */
:root{--bg:#f2f4f8;--card:#fff;--fg:#121722;--muted:#5b6678;--line:#e1e5ec;--soft:#f3f5f9;--rot:#b91c1c;--rot2:#991b1b;--rt:#b91c1c;--ok:#15803d;--gelb:#92400e;--gelbbg:rgba(245,158,11,.16);color-scheme:light}
:root[data-theme="dark"]{--bg:#0c1018;--card:#171d29;--fg:#f1f4f9;--muted:#a3adbf;--line:#263042;--soft:#1d2533;--rot:#dc2626;--rot2:#b91c1c;--rt:#ff8a8f;--ok:#4ade80;--gelb:#fbbf24;--gelbbg:rgba(245,158,11,.18);color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1018;--card:#171d29;--fg:#f1f4f9;--muted:#a3adbf;--line:#263042;--soft:#1d2533;--rot:#dc2626;--rot2:#b91c1c;--rt:#ff8a8f;--ok:#4ade80;--gelb:#fbbf24;--gelbbg:rgba(245,158,11,.18);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.kopf{position:sticky;top:0;z-index:5;background:var(--rot);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.kopf h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.6px}
.kopf a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.18);padding:9px 14px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center}
main{max-width:620px;margin:0 auto;padding:14px 14px 0}
.karte{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06)}
.karte h2{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.info{font-size:14px;color:var(--muted);margin:6px 0 0}
.offline{background:var(--gelbbg);color:var(--gelb);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:14px}
.gross{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border:0;border-radius:16px;background:var(--rot);color:#fff;font:inherit;font-size:22px;font-weight:800;text-decoration:none;text-align:center}
.gross:active{background:var(--rot2)}
.gross small{font-size:13px;font-weight:600;opacity:.9;display:block}
.nr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nr a,.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:14px;background:var(--soft);color:var(--fg);text-decoration:none;font:inherit;font-weight:800;font-size:20px;border:0;padding:8px;text-align:center}
.nr a small,.btn small{font-size:12px;font-weight:600;color:var(--muted)}
.nr a{background:#c62828;color:#fff}.nr a small{color:#fff;opacity:.92}
.nr a.breit{grid-column:1/-1}
.btn{font-size:16px;min-height:50px;width:100%;flex-direction:row;gap:8px}
.btn.pri{background:var(--rot);color:#fff}
.btn.pri small{color:#fff;opacity:.85}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chips button{border:1px solid var(--line);background:var(--soft);color:var(--fg);font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;min-height:40px}
.chips button.an{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--fg)}
.pos{background:var(--soft);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:20px;font-weight:800;line-height:1.35;word-break:break-word}
.pos small{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.satz{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:15px;margin:8px 0;white-space:pre-wrap}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:8px}
details{border-top:1px solid var(--line)}
details:first-of-type{border-top:0}
summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:54px;font-weight:700;font-size:17px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:'›';margin-left:auto;font-size:24px;color:var(--muted);transition:transform .15s}
details[open] summary::after{transform:rotate(90deg)}
summary .e{font-size:22px;width:30px;text-align:center}
ol{margin:0 0 12px;padding-left:22px}
ol li{margin-bottom:7px}
.wichtig{color:var(--rt);font-weight:800}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
dt{color:var(--muted);font-size:14px}
dd{margin:0;font-weight:700;overflow-wrap:anywhere}
dd.fehlt{color:var(--muted);font-weight:500;font-style:italic}
.pers{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.pers:first-of-type{border-top:0}
.pers .n{flex:1;min-width:0}
.pers .n b{display:block}
.pers .n small{display:block;color:var(--muted);font-size:13px}
.pers a{flex:none;min-height:44px;min-width:56px;border-radius:12px;background:var(--soft);color:var(--fg);text-decoration:none;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.pers a.anruf{background:var(--ok);color:#fff}
:root[data-theme="dark"] .pers a.anruf{color:#06210f}
.dok{display:block;width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--line)}
.mangel{background:var(--gelbbg);color:var(--gelb);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:8px}
.leer{background:var(--gelbbg);color:var(--gelb);border-radius:12px;padding:12px;font-weight:600}
.gz{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;overflow:auto}
.gz img{max-width:100%;max-height:100%}
.gz button{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;border:0;border-radius:999px;background:#fff;color:#000;font:inherit;font-weight:800;padding:12px 16px}
.pers2{display:flex;gap:8px;margin-top:8px}
.anruf2{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:62px;border-radius:14px;background:#ffd400;color:#1a1a1a;text-decoration:none;padding:8px 16px}
.anruf2 b{display:block;font-size:19px}.anruf2 small{display:block;font-size:14px;font-weight:600;opacity:.95}
.anruf2 .pk{font-weight:800;font-size:16px}
.sms2{flex:none;width:64px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--soft);color:var(--fg);text-decoration:none;font-weight:800}
.med{margin:4px 2px 0;font-size:14px;font-weight:700;color:var(--rt)}
a.tcs{display:flex;flex-direction:column;gap:2px;min-height:62px;justify-content:center;border-radius:14px;background:#ffd400;color:#1a1a1a;text-decoration:none;padding:8px 16px}
a.tcs b{font-size:14px;color:#1a1a1a;font-weight:700}a.tcs span{font-size:22px;font-weight:800}
</style>
</head>
<body>
<div class="kopf"><h1>NOTFALL</h1><a href="index.html" id="zurueck">← Womo</a></div>
<main id="m"></main>
<script>
(function () {
  'use strict';
  var h = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var m = document.getElementById('m');
  var A = null; try { A = JSON.parse(localStorage.getItem('womo-notfall')); } catch (e) {}
  var fz = (A && A.fz) || {}, personen = (A && A.personen) || [];
  var wert = function (k) { return fz[k] && fz[k].wert ? fz[k].wert : ''; };
  var tel = function (t) { return String(t || '').replace(/[^0-9+]/g, ''); };

  // Notrufnummern (Stand 13.11.2026, Wikipedia «List of emergency telephone numbers»). Die 112 gilt in der EU ueberall.
  // [Land, Polizei, Feuerwehr, Rettung, Hinweis]. Fehlt eine Nummer, gilt 112.
  var L = [
    ['Schweiz', '117', '118', '144', ''],
    ['Liechtenstein', '117', '118', '144', ''],
    ['Frankreich', '17', '18', '15', ''],
    ['Italien', '113', '115', '118', ''],
    ['Spanien', '091', '080', '061', ''],
    ['Portugal', '112', '112', '112', ''],
    ['Deutschland', '110', '112', '112', ''],
    ['Österreich', '133', '122', '144', ''],
    ['Belgien', '112', '112', '112', ''],
    ['Niederlande', '112', '112', '112', ''],
    ['Luxemburg', '112', '112', '112', ''],
    ['Dänemark', '112', '112', '112', ''],
    ['Schweden', '112', '112', '112', ''],
    ['Norwegen', '112', '110', '113', ''],
    ['Finnland', '112', '112', '112', ''],
    ['Island', '112', '112', '112', ''],
    ['Irland', '999', '999', '999', 'Auch 112 geht'],
    ['Vereinigtes Königreich', '999', '999', '999', 'Auch 112 geht'],
    ['Tschechien', '158', '150', '155', ''],
    ['Slowakei', '158', '150', '155', ''],
    ['Polen', '997', '998', '999', ''],
    ['Ungarn', '107', '105', '104', ''],
    ['Slowenien', '113', '112', '112', ''],
    ['Kroatien', '192', '193', '194', ''],
    ['Bosnien-Herzegowina', '122', '123', '124', 'Ausserhalb der EU: 112 kann je nach Netz nicht gehen'],
    ['Montenegro', '122', '123', '124', ''],
    ['Albanien', '129', '128', '127', 'Ausserhalb der EU: 112 kann je nach Netz nicht gehen'],
    ['Nordmazedonien', '192', '193', '194', ''],
    ['Griechenland', '100', '199', '166', ''],
    ['Bulgarien', '166', '160', '150', ''],
    ['Estland', '112', '112', '112', ''],
    ['Lettland', '112', '112', '112', ''],
    ['Litauen', '112', '112', '112', ''],
    ['Zypern', '112', '112', '112', ''],
    ['Malta', '112', '112', '112', '']
  ];
  var land = ''; try { land = localStorage.getItem('womo-notfall-land') || ''; } catch (e) {}
  if (!L.some(function (x) { return x[0] === land; })) {
    var ziel = ((A && A.reise && A.reise.ziel) || '').toLowerCase();
    var tr = L.filter(function (x) { return ziel && ziel.indexOf(x[0].toLowerCase()) >= 0; })[0];
    land = tr ? tr[0] : 'Schweiz';
  }

  var FAELLE = [
    ['🚗', 'Unfall', [
      'Warnblinker einschalten, anhalten, Motor aus. <b>Warnweste anziehen, bevor du aussteigst.</b>',
      'Alle aussteigen lassen und hinter die Leitplanke oder weit weg von der Strasse bringen.',
      'Warndreieck aufstellen, weit genug hinter dem Fahrzeug (auf Autobahn und ausserorts weiter weg).',
      '<b>Verletzte? Sofort 112 anrufen.</b> Standort sagen, wie viele Verletzte, was passiert ist. Erste Hilfe leisten, Verletzte nicht allein lassen.',
      'Fotos machen: alle Fahrzeuge, Kennzeichen, Schäden, Unfallstelle, Spuren.',
      'Namen, Adresse und Versicherung der anderen aufschreiben. Den Europäischen Unfallbericht ausfüllen. Nichts unterschreiben, was du nicht verstehst.',
      'Versicherung oder Schutzbrief anrufen (Nummer unter «Fahrzeug»). Danach die Familie informieren.'
    ]],
    ['🔧', 'Panne', [
      'Warnblinker einschalten und wenn möglich auf Pannenstreifen, Parkplatz oder Pannenbucht fahren.',
      'Warnweste anziehen. Alle aussteigen lassen und hinter die Leitplanke bringen.',
      'Warndreieck aufstellen.',
      'Pannenhilfe oder Schutzbrief anrufen (Nummer unter «Fahrzeug»). Standort bereithalten, siehe «Wo bin ich?».',
      '<b>Auf der Autobahn nichts selbst reparieren.</b> Reifenwechsel nur an einer sicheren Stelle.',
      'Nicht von irgendeinem Abschleppdienst abschleppen lassen, ohne vorher die Pannenhilfe oder die Versicherung zu fragen (sonst zahlt vielleicht niemand).'
    ]],
    ['🔥', 'Gasgeruch oder Feuer', [
      '<b>Gasgeruch: kein Feuer, keine Zigarette, keinen Schalter bedienen.</b>',
      'Flaschenventil (Gashahn) schliessen, wenn es ohne Risiko geht.',
      'Türen und Fenster öffnen, alle sofort ins Freie, weg vom Fahrzeug.',
      'Aus sicherer Entfernung 112 anrufen (Feuerwehr). Das Fahrzeug erst benützen, wenn die Gasanlage geprüft ist.',
      '<b>Feuer: alle raus, Abstand halten.</b> 112 anrufen. Nur löschen, wenn das Feuer klein ist und es gefahrlos geht. Gasflasche kann explodieren.',
      'Kopfschmerz, Schwindel, Übelkeit im Fahrzeug können Kohlenmonoxid sein: sofort lüften, ins Freie, 112.'
    ]],
    ['🩺', 'Verletzt oder krank', [
      '<b>112 anrufen</b>, Standort sagen, was passiert ist, wie viele Personen betroffen sind.',
      'Person nicht allein lassen. Bei Bewusstlosigkeit: Atmung prüfen, Hilfe von der Notrufzentrale am Telefon annehmen.',
      'Medizinische Hinweise der Familie siehe «Familie».',
      'Auslandkrankenversicherung oder Schutzbrief melden, wenn vorhanden. Belege und Arztberichte aufbewahren.'
    ]],
    ['🔒', 'Diebstahl oder Einbruch', [
      'Nichts anfassen, was Spuren hat. Wenn Täter in der Nähe sind: Abstand halten, <b>Polizei rufen</b>.',
      '<b>Anzeige bei der Polizei machen und eine schriftliche Bestätigung verlangen.</b> Ohne sie zahlt die Versicherung oft nicht.',
      'Fotos der Schäden. Liste dessen, was fehlt.',
      'Karten, Ausweise und Schlüssel sperren lassen. Versicherung und Familie informieren.'
    ]]
  ];

  function render() {
    var r = L.filter(function (x) { return x[0] === land; })[0];
    var out = '';
    out += '<div class="offline">Diese Karte öffnet sich auch ohne Netz. Anrufen geht nur mit Empfang. Den Standort liefert das GPS im Handy.</div>';
    if (!A) out += '<div class="leer" style="margin-bottom:14px">Noch keine Daten auf diesem Handy. Einmal die Womo-App mit Netz öffnen und anmelden, dann liegen Familie und Fahrzeug hier bereit. Die Notrufnummern gehen schon jetzt.</div>';

    // 1. Anrufen
    out += '<div class="karte"><a class="gross" href="tel:112"><span>112 anrufen<small>Geht fast überall in Europa. Verbindet mit Polizei, Feuerwehr und Rettung.</small></span></a>';
    out += '<h2 style="margin-top:16px">Land</h2><select id="land" aria-label="Land wählen">' + L.map(function (x) { return '<option' + (x[0] === land ? ' selected' : '') + '>' + h(x[0]) + '</option>'; }).join('') + '</select>';
    out += '<div class="nr"><a href="tel:' + r[1] + '">' + r[1] + '<small>Polizei</small></a><a href="tel:' + r[3] + '">' + r[3] + '<small>Rettung</small></a><a href="tel:' + r[2] + '">' + r[2] + '<small>Feuerwehr</small></a><a href="tel:112">112<small>alle Dienste</small></a></div>';
    if (r[4]) out += '<p class="info">' + h(r[4]) + '</p>';
    out += '</div>';


    // 1b. Pannenhilfe TCS (oeffentliche Nummern des TCS)
    out += '<div class="karte"><h2>Pannenhilfe TCS</h2><div class="stack" style="margin-top:0">' +
      '<a class="tcs" href="tel:0800140140"><b>In der Schweiz</b><span>0800 140 140</span></a>' +
      '<a class="tcs" href="tel:+41588272220"><b>Im Ausland</b><span>+41 58 827 22 20</span></a>' +
      '<a class="tcs" href="tel:+41588276655"><b>Dolmetscher-Dienst</b><span>+41 58 827 66 55</span></a></div>' +
      (wert('tcs') ? '<p style="margin:12px 0 0">Unsere TCS-Nummer: <b>' + h(wert('tcs')) + '</b></p>' : '') +
      (wert('schutzbrief') ? '<p class="info">' + h(wert('schutzbrief')) + '</p>' : '') + '</div>';

    // 2. Standort
    out += '<div class="karte"><h2>Wo bin ich?</h2><button class="btn pri" id="gps">📍 Meinen Standort bestimmen</button><div id="posbox"></div><p class="info">Das GPS geht auch ohne Netz. Beim ersten Mal fragt das Handy nach dem Standort: bitte «Erlauben» wählen.</p></div>';

    // 3. Was ist passiert
    out += '<div class="karte"><h2>Was ist passiert?</h2>' + FAELLE.map(function (f) {
      return '<details><summary><span class="e">' + f[0] + '</span>' + h(f[1]) + '</summary><ol>' + f[2].map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></details>';
    }).join('') + '</div>';

    // 4. Fahrzeug
    var rows = [['kennzeichen', 'Kennzeichen'], ['fahrzeug', 'Fahrzeug'], ['hoehe', 'Höhe (m)'], ['breite', 'Breite (m)'], ['laenge', 'Länge (m)'], ['gewicht', 'Gesamtgewicht (kg)'], ['treibstoff', 'Treibstoff'], ['versicherung', 'Versicherung'], ['police', 'Policennummer'], ['schutzbrief', 'Schutzbrief'], ['tcs', 'TCS-Nummer'], ['hinweis', 'Wichtig für Helfer']];
    var tf = function (t) { var mm = String(t).match(/\+?[0-9][0-9 ]{7,}/); return mm ? '<br><a href="tel:' + tel(mm[0]) + '" style="color:var(--rt);font-weight:800">📞 ' + h(mm[0].trim()) + '</a>' : ''; };
    out += '<div class="karte"><h2>Fahrzeug</h2><dl>' + rows.map(function (x) {
      var w = wert(x[0]); var extra = (x[0] === 'versicherung' || x[0] === 'schutzbrief') && w ? tf(w) : '';
      return '<dt>' + h(x[1]) + '</dt><dd' + (w ? '' : ' class="fehlt"') + '>' + (w ? h(w) + extra : 'nicht erfasst') + '</dd>';
    }).join('') + '</dl>';
    [['ausweis', 'Fahrzeugausweis'], ['vnachweis', 'Versicherungsnachweis']].forEach(function (d) {
      if (fz[d[0]] && fz[d[0]].foto) out += '<p class="info" style="margin-top:14px"><b>' + d[1] + '</b> (Tipp: gross ansehen)</p><img class="dok" data-gross="1" src="' + h(fz[d[0]].foto) + '" alt="' + d[1] + '">';
    });
    var l = A && A.letzte;
    if (l) {
      var wann = (l.wann || '').slice(0, 10).split('-').reverse().join('.');
      out += '<h2 style="margin-top:16px">Zustand laut letzter ' + (l.phase === 'ab' ? 'Übernahme' : 'Rückgabe') + ' (' + h(wann) + ')</h2><p style="margin:0">' + (l.km != null ? 'Kilometerstand <b>' + Number(l.km).toLocaleString('de-CH') + '</b>' : 'Kilometerstand unbekannt') + (l.tank ? ', Tank <b>' + h(l.tank) + '</b>' : '') + '</p>';
      if (l.schaeden) out += '<div class="mangel">Bekannte Schäden: ' + h(l.schaeden) + '</div>';
      if (l.maengel && l.maengel.length) out += '<div class="mangel">Mängel gemeldet: ' + l.maengel.map(h).join('; ') + '</div>';
      if (!l.schaeden && (!l.maengel || !l.maengel.length)) out += '<p class="info">Keine Schäden oder Mängel eingetragen. Das hilft der Versicherung als Nachweis: Was neu ist, ist vom jetzigen Vorfall.</p>';
    }
    out += '</div>';

    // 5. Familie
    var rz = A && A.reise;
    out += '<div class="karte"><h2>Familie</h2>';
    if (rz) out += '<p style="margin:0 0 6px"><b>Jetzt unterwegs:</b> ' + h(rz.fahrer) + (rz.mit && rz.mit.length ? ' mit ' + rz.mit.map(h).join(', ') : '') + (rz.gaeste ? ' und ' + rz.gaeste + ' Gast' + (rz.gaeste > 1 ? 'e' : '') : '') + (rz.ziel ? ', Ziel ' + h(rz.ziel) : '') + '</p>';
    out += personen.length ? personen.map(function (p) {
      var t = tel(p.tel);
      if (!t) return '<div class="pers"><div class="n"><b>' + h(p.name) + '</b><small>keine Nummer erfasst</small></div></div>';
      return '<div class="pers2"><a class="anruf2" href="tel:' + t + '"><span><b>' + h(p.name) + '</b><small>' + h(p.tel) + '</small></span><span class="pk">Anrufen</span></a><a class="sms2" href="sms:' + t + '">SMS</a></div>' + (p.medizin ? '<p class="med">⚕ ' + h(p.name) + ': ' + h(p.medizin) + '</p>' : '');
    }).join('') : '<p class="info" style="margin:0">Keine Personen auf diesem Handy gespeichert.</p>';
    out += '</div>';

    var st = A && A.stand ? new Date(A.stand) : null;
    out += '<p class="info" style="text-align:center">' + (st && !isNaN(st) ? 'Daten gespeichert am ' + st.toLocaleDateString('de-CH') + ' um ' + st.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' }) + '. Wird bei jedem Öffnen der Womo-App erneuert.' : '') + '<br>Notrufnummern Stand 13.11.2026. Vor der Reise prüfen.</p>';
    m.innerHTML = out;
    bind();
  }

  var pos = null;
  function satz() {
    if (!pos) return '';
    var kz = wert('kennzeichen'), f = wert('fahrzeug'), n = (A && A.reise) ? 1 + (A.reise.mit || []).length + (A.reise.gaeste || 0) : 0;
    return 'NOTFALL Womo' + (f ? ' ' + f : '') + (kz ? ', Kennzeichen ' + kz : '') + (n ? ', ' + n + ' Personen' : '') + '. Standort: ' + pos.la + ', ' + pos.lo + ' (Genauigkeit ca. ' + pos.ge + ' m). Karte: https://www.google.com/maps?q=' + pos.la + ',' + pos.lo;
  }
  function zeigePos(msg) {

    b.innerHTML = '<div class="pos">' + pos.la + ' N<br>' + pos.lo + ' O<small>Genauigkeit etwa ' + pos.ge + ' m · ' + new Date(pos.t).toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + '</small></div>' +
      '<p class="info" style="margin-top:0">Der Notruf will oft Koordinaten oder die nächste Strasse, Ortschaft und Kilometertafel. Lies die Zahlen langsam vor.</p>' +
      '<div class="satz" id="satz">' + h(kurz) + '</div>' +
      '<div class="stack"><button class="btn" id="kopie">📋 Text kopieren</button>' +
      personen.filter(function (p) { return tel(p.tel); }).map(function (p) { return '<a class="btn" href="sms:' + tel(p.tel) + '&body=' + encodeURIComponent(kurz) + '">✉️ SMS an ' + h(p.name) + ' mit Standort</a>'; }).join('') +
      '</div>';
    document.getElementById('kopie').onclick = function () {
      var t = satz(), bt = document.getElementById('kopie');
      try { navigator.clipboard.writeText(t).then(function () { bt.textContent = '✓ Kopiert'; }, fb); } catch (e) { fb(); }
      function fb() { var r = document.createRange(); r.selectNodeContents(document.getElementById('satz')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); bt.textContent = 'Text markiert: bitte kopieren'; }
    };
  }
  function bestimmen() {
    var b = document.getElementById('gps'); b.disabled = true; b.textContent = '📍 Suche Standort …';
    zeigePos('Standort wird gesucht. Bitte kurz warten, am besten im Freien.');
    if (!navigator.geolocation) { b.disabled = false; b.textContent = '📍 Nochmals versuchen'; zeigePos('Dieses Handy kann den Standort nicht bestimmen. Schau auf einer Kilometertafel, einem Wegweiser oder fragt Passanten.'); return; }
    navigator.geolocation.getCurrentPosition(function (p) {
      pos = { la: p.coords.latitude.toFixed(5), lo: p.coords.longitude.toFixed(5), ge: Math.round(p.coords.accuracy || 0), t: Date.now() };
      b.disabled = false; b.textContent = '📍 Standort neu bestimmen'; zeigePos();
    }, function (e) {
      b.disabled = false; b.textContent = '📍 Nochmals versuchen';
      zeigePos(e && e.code === 1 ? '<b class="wichtig">Standort nicht erlaubt.</b> Auf dem iPhone: Einstellungen → Datenschutz → Ortungsdienste → Safari-Websites (oder Womo) → «Beim Verwenden». Bis dahin: Kilometertafel, Wegweiser oder Ortsschild ablesen.' : 'Kein Standort gefunden. Bitte ins Freie gehen und nochmals versuchen. Bis dahin: Kilometertafel, Wegweiser oder Ortsschild ablesen.');
    }, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 });
  }
  function gross(src) {
    var o = document.createElement('div'); o.className = 'gz'; o.innerHTML = '<img alt=""><button type="button">✕ Schliessen</button>'; o.querySelector('img').src = src;
    o.onclick = function () { o.remove(); }; document.body.appendChild(o);
  }
  function bind() {
    document.getElementById('land').onchange = function (e) { land = e.target.value; try { localStorage.setItem('womo-notfall-land', land); } catch (x) {} var o = document.getElementById('gps') && pos; render(); if (pos) zeigePos(); };
    document.getElementById('gps').onclick = bestimmen;
    if (pos) zeigePos();
    m.querySelectorAll('[data-gross]').forEach(function (i) { i.onclick = function () { gross(i.src); }; });
  }
  render();
})();
